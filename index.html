<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respuestas a casos</title>
<style>
:root{--bg:#f2f4f7;--sf:#fff;--ink:#1c2430;--mut:#596577;--line:#dbe0e8;--acc:#2456d6;--accbg:#e6edfc;--es:#9a4a06;--esbg:#fdeedd;--pt:#0b6e42;--ptbg:#dff3e8;--new:#b3202a;--newbg:#fde6e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--sf:#1a2029;--ink:#e7ebf1;--mut:#97a2b3;--line:#2b3340;--acc:#8fb0ff;--accbg:#1f2b4a;--es:#f0b36a;--esbg:#3a2a15;--pt:#6fd6a3;--ptbg:#12332a;--new:#ff9a9f;--newbg:#3d1c1f}}
:root[data-theme="dark"]{--bg:#12161d;--sf:#1a2029;--ink:#e7ebf1;--mut:#97a2b3;--line:#2b3340;--acc:#8fb0ff;--accbg:#1f2b4a;--es:#f0b36a;--esbg:#3a2a15;--pt:#6fd6a3;--ptbg:#12332a;--new:#ff9a9f;--newbg:#3d1c1f}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.in{max-width:1000px;margin:0 auto}
h1{font-size:17px;margin:0 0 8px;font-weight:650;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 small{font-weight:400;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{flex:1 1 260px;position:relative}
.sb input{width:100%;font:inherit;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sb input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sb kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px system-ui;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
button{font:inherit;font-size:13px;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{background:var(--accbg)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--sf)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chips button{white-space:nowrap;border-radius:999px;padding:4px 11px}
.chips button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.chips span{color:var(--mut);margin-left:4px;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:6px 16px 60px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:13px;padding:12px 0 2px}
h2{font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--mut)}
details{background:var(--sf);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:550}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
.t{flex:1;min-width:0}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.es{background:var(--esbg);color:var(--es)}.tag.pt{background:var(--ptbg);color:var(--pt)}.tag.new{background:var(--newbg);color:var(--new)}.tag.n{background:var(--bg);color:var(--mut)}
.b{padding:2px 14px 14px;border-top:1px solid var(--line)}
.note{background:var(--newbg);color:var(--ink);border-radius:8px;padding:8px 12px;margin:12px 0 4px;font-size:14px}
.vh{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.cols{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:10px}
.vh+.cols{margin-top:0}
.lb{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.lh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.lg{font-size:12.5px;font-weight:650}.lg.es{color:var(--es)}.lg.pt{color:var(--pt)}
.cp{padding:3px 10px;font-size:12.5px}
.cp.ok{background:var(--acc);color:var(--sf);border-color:var(--acc)}
pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font:inherit;font-size:14.5px;line-height:1.55}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.empty button{margin-top:10px}
[hidden]{display:none!important}
dialog{width:min(760px,94vw);max-height:90vh;overflow:auto;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-size:16px}
dialog label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
dialog input:not([type=checkbox]),dialog select,dialog textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog textarea{resize:vertical}
dialog .ck{display:flex;gap:8px;align-items:center;color:var(--ink)}
dialog .cols{margin-top:0}
.mu{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.vr{border:1px solid var(--line);border-radius:10px;padding:10px 10px 0;margin-bottom:10px}
.vrh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.sp{flex:1}
.pri{background:var(--acc);color:var(--sf);border-color:var(--acc)}.pri:hover{background:var(--acc);opacity:.9}
.danger{color:var(--new);border-color:var(--new)}
.sm{padding:3px 9px;font-size:12.5px}
.cr{display:flex;gap:6px;align-items:center;margin-bottom:6px}.cr input{margin:0!important;flex:1}.cn{color:var(--mut);font-size:12.5px;min-width:22px;text-align:right}
.act{margin-top:12px;display:flex;justify-content:flex-end}
button:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sf);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){summary::before{transition:none}}
</style>
</head>
<body>
<header><div class="in">
<h1>Respuestas a casos <small id="cnt"></small></h1>
<div class="row">
<div class="sb"><input id="q" type="search" placeholder="Buscar por título o texto (ej. retiro, PayPal, reembolso)" autocomplete="off" aria-label="Buscar"><kbd>/</kbd></div>
<div class="seg" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="pt">PT</button><button data-l="both">ES + PT</button></div>
<button id="all">Abrir todo</button><button id="none">Cerrar todo</button><button id="newc" class="pri">Nuevo caso</button><button id="catb">Categorías</button><button id="bkb">Respaldo</button>
</div>
<div class="chips" id="chips"></div>
</div></header>
<main><div id="list"></div></main>
<dialog id="dlg"><div id="dbody"></div></dialog>
<div id="toast" role="status"></div>
<script>
const ORIG={"cats": [{"id": "pagos", "name": "Pagos y recargas"}, {"id": "retiros", "name": "Retiros"}, {"id": "chat", "name": "Mensajes y chat"}, {"id": "fotos", "name": "Fotos privadas"}, {"id": "cuenta", "name": "Cuenta y perfil"}, {"id": "tribu", "name": "Tribus y agencias"}, {"id": "general", "name": "Generales y sugerencias"}], "cases": [{"id": "c0", "cat": "fotos", "title": "Actualización de fotos privadas (nueva norma)", "es": ["¡Hola! Comprendemos tu preocupación respecto a las restricciones en el envío de fotos privadas y el impacto que esto puede generar en la experiencia dentro de la aplicación.\n\nTe informamos que, desde el pasado 11 de noviembre, se encuentran vigentes las nuevas normas de seguridad para fotos privadas con el fin de proteger a la comunidad y cumplir con las regulaciones de la plataforma. Bajo estas directrices:\n\nNo está permitido enviar: Fotos de órganos genitales masculinos o femeninos, imágenes de secreciones sexys o corporales, ni ningún contenido relacionado con pornografía infantil.\n\nTodo lo demás está permitido: Fuera de estas tres categorías prohibidas, los demás tipos de fotos privadas continúan habilitados y se pueden compartir con normalidad.\n\nAgradecemos tu comprensión."], "pt": ["Olá! Compreendemos a sua preocupação em relação às restrições no envio de fotos privadas e ao impacto que isso pode gerar na experiência dentro do aplicativo.\n\nInformamos que, desde o último dia 11 de novembro, estão em vigor as novas regras de segurança para fotos privadas, com o objetivo de proteger a comunidade e cumprir com as exigências da plataforma. Sob essas diretrizes:\n\nNão é permitido enviar: Fotos de órgãos genitais masculinos ou femininos, imagens de secreções sexuais, nem qualquer conteúdo relacionado a pornografia infantil.\n\nO restante continua permitido: Fora dessas três categorias proibidas, os demais tipos de fotos privadas continuam liberados e podem ser compartilhados normalmente.\n\nAgradecemos sua compreensão."], "isNew": true, "note": "Vigente desde el 11 de noviembre. Prohibido: genitales (masculinos o femeninos), secreciones sexuales y pornografía infantil. El resto de fotos privadas está permitido."}, {"id": "c1", "cat": "fotos", "title": "Fotos privadas: filtros de seguridad", "es": ["¡Hola! ¿Cómo estás? Entendemos tu situación. Te informamos que el sistema cuenta con filtros de seguridad automáticos que supervisan el intercambio de archivos. Si intentas subir o enviar fotos privadas y la plataforma no lo permite, es porque el contenido ha sido detectado como incumplimiento de las normas de convivencia o políticas de seguridad de la app. Estas restricciones existen para mantener un ambiente seguro y evitar el intercambio de contenido inapropiado o explícito. Te recomendamos evitar el envío de este tipo de imágenes para prevenir sanciones temporales o el bloqueo permanente de tu cuenta. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!", "¡Hola! ¿Cómo estás? Entiendo perfectamente tu frustración al sentir que tu inversión no se está respetando. Sin embargo, no se trata de un fraude, sino de las normas de seguridad y protección de datos de la plataforma. Aquí te explicamos por qué sucede esto: Filtro de Datos Personales: Por políticas de seguridad, el sistema detecta y bloquea automáticamente el intercambio de información externa como números de teléfono, correos electrónicos o redes sociales en los chats. Esto se hace para proteger a los usuarios de posibles estafas o conductas fuera de la supervisión de la app. Seguridad de la Cuenta: Intercambiar contactos personales puede llevar a que el sistema marque tu cuenta para revisión o la suspenda por incumplimiento de los términos de servicio. Recomendación: Te sugerimos utilizar las herramientas de la aplicación (mensajes de texto, voz y videollamadas) para conocer a las personas de forma segura dentro de la plataforma. Si tiene alguna otra pregunta en el futuro o presenta algún inconveniente al intentar realizar el pago, no dude en ponerse en contacto con nosotros nuevamente. ¡Estaremos encantados de ayudarle!"], "pt": ["Olá! Tudo bem? Entendemos sua situação. Informamos que o sistema conta com filtros de segurança automáticos que supervisionam a troca de arquivos. Se você tentar carregar ou enviar fotos privadas e a plataforma não permitir, é porque o conteúdo foi detectado como descumprimento das normas de convivência ou políticas de segurança do app. Estas restrições existem para manter um ambiente seguro e evitar a troca de conteúdo inapropriado ou explícito. Recomendamos evitar o envio deste tipo de imagens para prevenir sanções temporárias ou o bloqueio permanente da sua conta. Agradecemos o seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!", "Olá! Tudo bem? Entendo perfeitamente sua frustração ao sentir que seu investimento não está sendo respeitado. No entanto, não se trata de uma fraude, mas sim das normas de segurança e proteção de dados da plataforma. Aqui explicamos por que isso acontece: Filtro de Dados Pessoais: Por políticas de segurança, o sistema detecta e bloqueia automaticamente a troca de informações externas como números de telefone, e-mails ou redes sociais nos chats. Isso é feito para proteger os usuários de possíveis golpes ou condutas fora da supervisão do app. Segurança da Conta: Trocar contatos pessoais pode levar o sistema a marcar sua conta para revisão ou suspendê-la por descumprimento dos termos de serviço. Recomendação: Sugerimos utilizar as ferramentas do aplicativo (mensagens de texto, voz e chamadas de vídeo) para conhecer as pessoas de forma segura dentro da plataforma. Se tiver qualquer outra dúvida no futuro ou apresentar algum problema ao tentar realizar o pagamento, não hesite em nos contatar novamente. Estaremos felizes em ajudá-lo!"]}, {"id": "c2", "cat": "fotos", "title": "Problema de fotos privadas (feedback de usuarias)", "es": [], "pt": ["Olá! Esperamos que te encontres muito bem.\n\nAgradecemos sinceramente seus comentários e sugestões em relação à atualização do sistema de fotos privadas. Compreendemos seu ponto de vista sobre o impacto nas ferramentas de monetização e o investimento em conteúdos de alta qualidade; no entanto, os ajustes da plataforma e a intensificação dos filtros de segurança são executados de forma automática para garantir o cumprimento das normas de proteção da comunidade e prevenir más práticas. Avaliamos constantemente esse tipo de feedback e agradecemos suas sugestões, que serão levadas em consideração pela equipe de desenvolvimento para otimizar futuras atualizações.\n\nAgradecemos sua compreensão."]}, {"id": "c3", "cat": "fotos", "title": "Cambio de valor en fotos", "es": ["¡Hola! Así es, hemos realizado una actualización en los valores de la aplicación. Esta decisión se tomó para incrementar el valor de las llamadas, que es nuestra función principal. Queremos priorizar la interacción en vivo para que las usuarias puedan generar mayores ganancias por su tiempo y dedicación en cada conversación. Al ajustar el precio de las fotos privadas a 600 diamantes, buscamos que esta función sea un complemento dinámico, permitiendo que el enfoque principal de crecimiento y beneficios económicos se concentre en las llamadas. ¡Te recomendamos aprovechar este cambio para potenciar tus transmisiones y llamadas, ya que ahora son mucho más valiosas!"], "pt": ["Olá! Isso mesmo, realizamos uma atualização nos valores do aplicativo. Esta decisão foi tomada para aumentar o valor das chamadas, que é a nossa função principal. Queremos priorizar a interação ao vivo para que as usuárias possam gerar maiores ganhos pelo seu tempo e dedicação em cada conversa. Ao ajustar o preço das fotos privadas para 600 diamantes, buscamos que esta função seja um complemento dinâmico, permitindo que o foco principal de crescimento e benefícios econômicos se concentre nas chamadas. Recomendamos aproveitar esta mudança para potencializar suas transmissões e chamadas, já que agora elas são muito mais valiosas!"]}, {"id": "c4", "cat": "fotos", "title": "Cambio del precio de las fotos (explicación)", "es": [], "pt": ["Olá! Tudo bem? Entendo perfeitamente sua inconformidade, mas quero explicar o motivo dessas mudanças, pois elas foram desenhadas para que seus ganhos finais sejam maiores.\nRealizamos ajustes nos preços por duas razões principais:\nPrioridade em Chamadas: Aumentamos o preço das chamadas, o que significa que agora você ganhará mais dinheiro por cada minuto de conversa. Queremos que seu esforço seja melhor recompensado nesta seção.\nAcessibilidade em Fotos: Muitos usuários comentaram que o preço anterior das fotos era muito alto e não estavam dispostos a pagar. Ao baixar o preço da \"foto privada\" para 600, buscamos que mais usuários as comprem, aumentando o volume das suas vendas.\nAlém disso, nossas campanhas publicitárias agora se focarão em atrair mais usuários para as chamadas, que é onde você obterá melhores benefícios. Sugerimos aproveitar esta mudança impulsionando mais as chamadas com seus seguidores. Estamos trabalhando para que a comunidade cresça e você ganhe mais!"]}, {"id": "c5", "cat": "pagos", "title": "Problema de recarga", "es": ["¡Hola! ¿Cómo está? Aceptamos recargas directas (Google Play y Apple Pay) y también pagos de terceros, como PIX. ¿En qué etapa está teniendo dificultades? Por favor, envíenos una captura de pantalla para que podamos ayudarlo mejor. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!", "¡Hola! Muy buenas tardes, es un gusto saludarle. Lamentamos los inconvenientes que está presentando para completar su proceso de recarga.\n\nPara asistirle, le sugerimos realizar el pago a través de nuestro sitio web oficial, el cual ofrece un entorno más estable para esta gestión:\n\nEnlace oficial: Por favor, acceda a https://www.timo.club/#/rechargeMall para procesar su recarga de manera directa."], "pt": ["Olá! Tudo bem? Aceitamos recargas diretas (Google Play e Apple Pay) e também pagamentos de terceiros, como o PIX. Em qual etapa você está encontrando dificuldades? Por favor, envie-nos uma captura de tela para que possamos ajudá-lo melhor. Agradecemos o seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!", "Olá! Muito boa tarde, é um prazer saudá-lo. Lamentamos os inconvenientes que está a ter para completar o seu processo de recarga.\nPara o ajudar, sugerimos que realize o pagamento através do nosso site oficial, que oferece um ambiente mais estável para esta gestão:\n\nLink oficial: Por favor, aceda a https://www.timo.club/#/rechargeMall para processar a sua recarga de forma direta."]}, {"id": "c6", "cat": "pagos", "title": "No me llega la recarga", "es": ["¡Hola! ¿Cómo está? Le informamos que ya hemos escalado su caso con nuestro equipo técnico. Tan pronto como tengamos alguna novedad o actualización sobre el estado de su solicitud, sus monedas o su paquete VIP, nos pondremos en contacto con usted de inmediato.\n\nMientras tanto, tenga en cuenta que las monedas pueden tardar en llegar debido a la conexión a Internet. Por favor, espere y actualice la página. Si aún no aparecen, reinicie la aplicación o inicie sesión nuevamente. Verifique su conexión a Internet y si el valor se ha debitado con éxito.\n\n¡Nuestro equipo lo resolverá para usted! Gracias por su paciencia y, si tiene alguna otra pregunta, no dude en contactarnos nuevamente. ¡Estaremos encantados de ayudarlo!", "¡Hola! ¿Cómo está? Tenga en cuenta que las monedas pueden tardar en llegar debido a la conexión a Internet. Por favor, espere y actualice la página. Si aún no aparecen, reinicie la aplicación o inicie sesión nuevamente. Verifique su conexión a Internet y si el valor se ha debitado con éxito.\n\nSi estos pasos no resuelven el problema y aún no nos ha enviado sus datos, póngase en contacto con nuestro servicio al cliente en official.br@timo.club o a través del servicio al cliente en línea proporcionando:\n\nSu ID de usuario.\n\nCaptura de pantalla del comprobante de pago (número de pedido en Google Pay o el recibo de Apple o del banco).\n\nDatos de su cuenta bancaria.\n\n¡Nuestro equipo lo resolverá para usted! Gracias por su paciencia y, si tiene alguna otra pregunta, no dude en contactarnos nuevamente. ¡Estaremos encantados de ayudarlo!", "¡Hola! ¿Cómo estás? Siento mucho que tu recarga aún no se haya reflejado en tu cuenta.\n\nPara poder localizar tu pago y ayudarte a resolverlo de inmediato, necesito que me envíes  información fundamental:\n\nUna captura de pantalla de tu comprobante de pago (si fue por Google Play, debe aparecer el código GPA).\n\nSin este dato, nuestro equipo técnico no puede rastrear la transacción en el sistema. ¡En cuanto me lo envíe, le daré prioridad a tu caso!\n\nAgradecemos tu contacto y estaremos aquí para ayudarte con cualquier pregunta."], "pt": ["Olá! Como vai? Encaminhamos seu caso para nossa equipe técnica. Assim que tivermos novidades sobre o status da sua solicitação, suas moedas ou seu pacote VIP, entraremos em contato imediatamente.\n\nEnquanto isso, observe que as moedas podem demorar um pouco para aparecer devido à sua conexão com a internet. Aguarde e atualize a página. Se elas ainda não aparecerem, reinicie o aplicativo ou faça login novamente. Verifique sua conexão com a internet e se os fundos foram debitados com sucesso.\n\nNossa equipe resolverá isso para você! Agradecemos sua paciência e, caso tenha mais alguma dúvida, não hesite em nos contatar novamente. Ficaremos felizes em ajudar!", "Olá! Como vai? Observe que as moedas podem demorar um pouco para aparecer devido à sua conexão com a internet. Aguarde e atualize a página. Se elas ainda não aparecerem, reinicie o aplicativo ou faça login novamente. Verifique sua conexão com a internet e se a cobrança foi concluída com sucesso.\nSe essas etapas não resolverem o problema e você ainda não tiver nos enviado suas informações, entre em contato com nossa equipe de atendimento ao cliente pelo e-mail official.br@timo.club ou pelo suporte online, fornecendo:\nSeu ID de usuário.\nUma captura de tela do seu comprovante de pagamento (número do pedido do Google Pay, recibo da Apple ou extrato bancário).\nSeus dados bancários.\nNossa equipe resolverá isso! Agradecemos sua paciência e, se tiver mais alguma dúvida, não hesite em nos contatar novamente. Ficaremos felizes em ajudar!", "Olá! Como vai? Sinto muito que a sua recarga ainda não tenha aparecido na sua conta.\nPara localizar o seu pagamento e ajudar a resolver a situação prontamente, preciso que você me envie algumas informações essenciais:\nUm print (captura de tela) do seu comprovante de pagamento (se foi pelo Google Play, o código GPA deve estar visível).\nSem esse dado, nossa equipe técnica não consegue rastrear a transação no sistema. Assim que você me enviar, darei prioridade ao seu caso!\nAgradecemos o seu contato e estamos à disposição para ajudar com qualquer dúvida."]}, {"id": "c7", "cat": "pagos", "title": "Pago no recibido (actualización Mila)", "es": ["¡Hola! ¿Cómo estás? Hemos realizado una revisión exhaustiva de nuestro sistema técnico y lamentamos informarte que no hemos recibido el pago de tu compra. Dado que el dinero no se ha ingresado en nuestra plataforma, te sugerimos seguir estos pasos:\n\nVerifica tu reembolso: Revisa tu extracto bancario o el saldo de tu tienda para confirmar si el dinero ya se ha reembolsado automáticamente.\n\nContacta a Google Play: Si no has recibido el reembolso, debes contactar directamente al Soporte de Google Play Store para solicitarlo, ya que ellos gestionan las transacciones externamente a nuestra aplicación.\n\nRevisa tu historial: Asegúrate de que la transacción no aparezca como \"Pendiente\" o \"Cancelada\" en tu historial de compras de Google.\n\nSi, tras contactar con Google, el problema persiste, envíenos el recibo original de la transacción de Google donde se vea claramente el ID de la transacción de GPA. Con esta información, podremos realizar una investigación más exhaustiva. Lamentamos las molestias ocasionadas, pero dado que no tenemos constancia de la transacción, no podemos activar el saldo manualmente en este momento. Gracias por su comprensión.", "Hola, ¿cómo está? Le informamos que hemos realizado una búsqueda exhaustiva en nuestro sistema y no hemos recibido este pago. Esto significa que la transacción no se completó en nuestra plataforma. Siga estos pasos para recuperar su dinero:\n\nVerifique su reembolso: Compruebe los movimientos en su cuenta bancaria o monedero digital para confirmar si ya ha recibido un reembolso automático.\n\nContacte con su banco o proveedor: Si se le descontó el dinero y aún no lo ha recibido, póngase en contacto directamente con su banco o con el servicio de atención al cliente de su monedero para solicitar un reembolso.\n\nHistorial de transacciones: Muestre a su banco un comprobante que indique que el pago no se realizó correctamente o que la tienda no lo recibió.\n\nLamentamos las molestias, pero dado que el dinero aún no ha ingresado en nuestro sistema, solo su banco puede procesar el reembolso. ¡Esperamos que lo resuelva pronto!", "¡Hola! ¿Cómo está? Hemos revisado su caso en detalle en nuestro sistema y, lamentablemente, aún no hemos recibido el pago de su pedido.\n\nSiga estas instrucciones para resolverlo:\n\nRevise su estado de cuenta: Compruebe si el importe ya se ha reembolsado automáticamente a su cuenta bancaria o monedero digital.\n\nContacte a su banco: Si el importe se ha cargado y no se ha reembolsado, póngase en contacto con su banco o con el servicio de atención al cliente de su monedero digital para solicitar un reembolso, ya que el importe no se transfirió a nuestra plataforma.\n\nLamentamos las molestias y, en cuanto se confirme el reembolso o se resuelva el problema con el banco, podrá intentar realizar una nueva compra.\n\nGracias por contactarnos. Si tiene alguna otra pregunta, no dude en contactarnos."], "pt": ["Olá! Tudo bem? Realizamos uma revisão exaustiva em nosso sistema técnico e lamentamos informar que não recebemos o pagamento da sua compra. Como o dinheiro não entrou em nossa plataforma, sugerimos que você siga estes passos:\nVerifique seu reembolso: Verifique o extrato da sua conta bancária ou o saldo da sua loja para confirmar se o dinheiro já foi devolvido automaticamente.\nContate o Google Play: Se não recebeu o reembolso, você deverá entrar em contato diretamente com o Suporte da Google Play Store para solicitar a devolução do seu dinheiro, pois eles gerenciam as transações de forma externa ao nosso app.\nRevise o histórico: Certifique-se de que a transação não apareça como \"Pendente\" ou \"Cancelada\" no seu histórico de compras do Google.\nSe, após contatar o Google, o problema persistir, por favor, envie-nos o recibo original da transação do Google onde conste claramente o ID da transação GPA. Com esse dado, poderemos realizar uma investigação mais profunda. Lamentamos os transtornos causados, mas, como não temos registro da entrada, não nos é possível ativar o saldo manualmente por enquanto. Obrigado pela compreensão.", "Olá, tudo bem? Informo que realizamos uma busca minuciosa em nosso sistema e não recebemos este pagamento. Isso significa que a transação não foi concluída para a nossa plataforma. Por favor, siga estes passos para garantir que você recupere seu dinheiro:\nVerifique seu reembolso: Verifique os movimentos da sua conta bancária ou carteira digital para confirmar se já recebeu um reembolso automático.\nContate seu banco ou provedor: Se o dinheiro foi descontado e você ainda não o recebeu de volta, deve entrar em contato diretamente com seu banco ou com o suporte da sua carteira (wallet) para apresentar uma solicitação de reembolso.\nHistórico de transações: Mostre ao seu banco o comprovante indicando que o pagamento não foi bem-sucedido ou que a loja não o recebeu.\nLamentamos os transtornos, mas, como o dinheiro não entrou em nosso sistema, apenas o seu banco pode processar a devolução. Espero que resolva logo!", "Olá! Como você está? Verificamos o teu caso detalhadamente em nosso sistema e, infelizmente, não recebemos o pagamento referente ao teu pedido até o momento.\nPor favor, segue estas orientações para resolvermos isso:\nVerifica o teu extrato: Confere se o valor já foi estornado (devolvido) automaticamente para o teu saldo bancário ou carteira digital.\nEntra em contato com o teu Banco: Caso o valor tenha sido descontado e não tenha retornado, por favor, entra em contato com o suporte do teu banco ou da tua carteira digital para solicitar o reembolso, pois o valor não foi repassado para a nossa plataforma.\nLamentamos o inconveniente e, assim que o estorno for confirmado ou o problema com o banco resolvido, poderás tentar realizar uma nova compra.\nAgradecemos o teu contato e, se tiveres qualquer outra dúvida, não hesites em nos procurar!"]}, {"id": "c8", "cat": "pagos", "title": "Info de formas de pago", "es": ["¡Hola! ¿Cómo estás? Te informamos que los métodos de pago disponibles dependen directamente de tu ubicación y de la configuración de tu tienda de aplicaciones (Google Play Store o App Store). Para verificar si puedes utilizar el método que buscas, por favor sigue estos pasos: Ingresa a la sección \"Recargar\" en tu perfil. Selecciona el paquete de monedas que deseas. En las opciones de pago, revisa la opción de \"Pagos Locales\". Si no visualizas la opción, significa que por ahora el sistema solo permite los métodos que aparecen listados en tu pantalla (como tarjetas de crédito, débito o saldo de la tienda). Te recomendamos usar los métodos habilitados oficialmente para asegurar que tus monedas se acrediten de inmediato. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": ["Olá! Tudo bem? Informamos que os métodos de pagamento disponíveis dependem diretamente da sua localização e da configuração da sua loja de aplicativos (Google Play Store ou App Store). Para verificar se você pode utilizar um método específico, por favor, siga estes passos:\nEntre na seção \"Recarregar\" no seu perfil.\nSelecione o pacote de moedas que deseja.\nNas opções de pagamento, verifique se aparece o método que você procura.\nSe você não visualizar a opção, significa que, por enquanto, o sistema só permite os métodos que aparecem listados na sua tela (como cartões de crédito, débito ou saldo da loja). Recomendamos usar os métodos habilitados oficialmente para garantir que suas moedas sejam creditadas imediatamente. Agradecemos o seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!"]}, {"id": "c9", "cat": "pagos", "title": "Comprar monedas", "es": ["¡Hola! ¿Cómo estás? Para comprar monedas y seguir disfrutando de todas las funciones de la app, solo debes seguir estos pasos: Ve a tu perfil en la sección \"Yo\". Selecciona la opción \"Monedas\" o el botón de \"Recarga\". Elige el paquete que más te convenga. Confirma el pago a través de la tienda oficial de tu celular (Google Play Store o App Store). Recuerda que los precios y métodos de pago dependen directamente de la configuración de tu tienda. Una vez que completes la transacción, las monedas se verán reflejadas en tu saldo de inmediato. ¡Saludos!"], "pt": ["Olá! Tudo bem? Para comprar moedas e continuar desfrutando de todas as funções do app, basta seguir estes passos: Vá ao seu perfil na seção \"Eu\". Selecione a opção \"Moedas\" ou o botão de \"Recarga\". Escolha o pacote que melhor lhe atenda. Confirme o pagamento através da loja oficial do seu celular (Google Play Store o App Store). Lembre-se que os preços e métodos de pagamento dependem diretamente da configuração da sua loja. Assim que completar a transação, as moedas serão refletidas no seu saldo imediatamente. Saudações!"]}, {"id": "c10", "cat": "pagos", "title": "Monedas y recompensas gratis", "es": ["¡Hola! ¿Cómo estás? Entiendo que busques opciones para obtener monedas sin costo. Dentro de la plataforma, existen formas oficiales y seguras de conseguir beneficios de forma gratuita: Tareas Diarias: Ingresa a la sección de \"Centro de Tareas\" o \"Misiones\". Podrás obtener monedas o recompensas realizando acciones sencillas como el registro diario (check-in), completar la información de tu perfil o ver anuncios premiados si están disponibles en tu región. Eventos y Actividades: Mantente pendiente de los banners principales. Participar en eventos temporales y cumplir metas de interacción suele otorgar premios y monedas gratis. Cofres de Recompensa: Explora las diferentes salas y apartados; a menudo se habilitan cofres de tiempo que otorgan pequeñas cantidades de saldo por permanecer activa en la aplicación. Evita siempre sitios externos que prometan \"monedas infinitas\", ya que son estafas que ponen en riesgo tu seguridad. La única vía confiable es a través de las misiones dentro de la aplicación. Gracias por tu tiempo y si tienes alguna pregunta contáctanos nuevamente."], "pt": ["Olá! Tudo bem? Entendo que você esteja procurando opções para obter moedas sem custo. Dentro da plataforma, existem formas oficiais e seguras de conseguir benefícios gratuitamente: Tarefas Diárias: Entre na seção de \"Centro de Tarefas\" ou \"Missões\". Você poderá obter moedas ou recompensas realizando ações simples como o registro diário (check-in), completar as informações do seu perfil ou ver anúncios premiados, se estiverem disponíveis na sua região. Eventos e Atividades: Fique atento aos banners principais. Participar de eventos temporários e cumprir metas de interação costuma render prêmios e moedas grátis. Baús de Recompensa: Explore as diferentes salas e seções; a cada certo tempo são habilitados baús que concedem pequenas quantidades de saldo por permanecer ativa no aplicativo. Evite sempre sites externos que prometam \"moedas infinitas\", pois são golpes que colocam em risco sua segurança. A única via confiável é através das missões dentro do aplicativo. Obrigado pelo seu tempo e, se tiver alguma dúvida, contate-nos novamente."]}, {"id": "c11", "cat": "pagos", "title": "Reembolso", "es": ["¡Hola, ¿cómo está? Lamentamos informar que normalmente no realizamos reembolsos. No entanto, caso o problema haya sido causado por fallas del sistema o otras situaciones excepcionales, usted puede entrar en contacto con nuestro atención al cliente online, haremos lo posible para ayudarlo! Gracias por su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": ["Olá, tudo bem? Lamentamos informar que normalmente não realizamos reembolsos. No entanto, caso o problema tenha sido causado por falhas do sistema ou outras situações excepcionais, você pode entrar em contato com nosso atendimento ao cliente online, faremos o possível para ajudá-lo! Obrigado pelo seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!"]}, {"id": "c12", "cat": "pagos", "title": "Cancelar suscripciones", "es": [], "pt": ["Olá! Entendemos que você deseja cancelar seus planos e desinstalar o aplicativo.\nÉ muito importante saber que apenas desinstalar o aplicativo não cancela automaticamente as assinaturas feitas através da sua loja de aplicativos (Google Play Store ou Apple App Store), pois as cobranças são gerenciadas diretamente por eles.\nPara cancelar com segurança e evitar novas cobranças, siga estes passos:\nDentro do aplicativo Timo Club:\nVá ao seu Perfil.\nClique na opção de Recarregar.\nSelecione a aba VIP.\nClique no ícone de Interrogação (?) localizado no canto superior para acessar as instruções de gerenciamento e cancelamento.\nNa sua loja oficial:\nNo Android (Google Play): Abra a Play Store > Clique no seu perfil > Pagamentos e assinaturas > Assinaturas > Selecione o Timo e clique em \"Cancelar assinatura\".\nNo iPhone (App Store): Vá em Ajustes > Clique no seu Nome/ID Apple > Assinaturas > Selecione o Timo e clique em \"Cancelar Assinatura\".\nEstamos aqui para ajudar você! Se tiver qualquer dúvida sobre como localizar essas configurações ou precisar de assistência antes de partir, conte conosco.", "Olá, tudo bem? Entendo perfeitamente sua preocupação com essa cobrança automática. Explico como funciona para que você possa pará-la e solicitar seu dinheiro de volta:\nComo cancelar a assinatura: O aplicativo não tem acesso direto ao seu cartão; a cobrança é feita pela loja do seu celular. Para remover seu cartão ou cancelar a assinatura semanal, você deve ir à Play Store (Android) ou App Store (iPhone), entrar no seu perfil e procurar a seção de \"Assinaturas\". Lá você poderá cancelá-la para que não seja cobrado novamente.\nSolicitação de Reembolso: Como o pagamento foi gerenciado pelo Google ou Apple, nós não podemos devolver o dinheiro diretamente. Você deve entrar no histórico de compras da sua loja de aplicativos e selecionar a opção \"Solicitar um reembolso\", explicando que não deseja o serviço.\nEliminar Cartão: Na mesma seção de \"Pagamentos e assinaturas\" do seu telefone, você pode administrar seus métodos de pagamento e remover seu cartão de forma definitiva.\nLamentamos os transtornos, mas lembre-se que desinstalar o aplicativo não cancela automaticamente os pagamentos semanais; é necessário fazer isso pelas configurações da sua conta."]}, {"id": "c13", "cat": "pagos", "title": "VIP: compra no reflejada", "es": ["¡Hola! ¿Cómo estás? Siento mucho que no veas reflejada tu compra. Cuando se trata de una recarga VIP, el proceso puede ser un poco distinto a las monedas normales. Por favor, verifica lo siguiente: Activación de Beneficios: A diferencia de las monedas, el VIP activa beneficios (como la corona, el marco o permisos especiales) de forma inmediata. Revisa si tu perfil ya muestra el icono VIP. Saldo de Monedas: Si tu paquete VIP incluía monedas de regalo, intenta reiniciar la aplicación o cerrar e iniciar sesión para que el contador de saldo se actualice. Historial de Google/Apple: Verifica que el pago no aparezca como \"Pendiente\" en tu tienda de aplicaciones. Si el pago fue procesado pero no tienes los beneficios, es un error de sincronización. Si tiene alguna otra pregunta en el futuro o presenta algún inconveniente al intentar realizar el pago, no dude en ponerse en contacto con nosotros nuevamente. ¡Estaremos encantados de ayudarle!"], "pt": ["Olá! Tudo bem? Sinto muito que você não esteja vendo sua compra refletida. Quando se trata de uma recarga VIP, o processo pode ser um pouco diferente das moedas normais. Por favor, verifique o seguinte: Ativação de Benefícios: Diferente das moedas, o VIP ativa benefícios (como a coroa, o molde ou permissões especiais) de forma imediata. Verifique se o seu perfil já mostra o ícone VIP. Saldo de Moedas: Se o seu pacote VIP incluía moedas de presente, tente reiniciar o aplicativo ou encerrar e iniciar a sessão para que o contador de saldo seja atualizado. Histórico do Google/Apple: Verifique se o pagamento não aparece como \"Pendente\" na sua loja de aplicativos. Se o pagamento foi processado mas você não tem os benefícios, é um erro de sincronização. Se tiver qualquer outra dúvida no futuro ou apresentar algum problema ao tentar realizar o pagamento, não hesite em nos contatar novamente. Estaremos felizes em ajudá-lo!"]}, {"id": "c14", "cat": "pagos", "title": "VIP: beneficios y diamantes", "es": [], "pt": ["Olá, tudo bem? Na página de compra de VIP, há uma descrição detalhada dos benefícios, que não inclui o envio de moedas como presente. No entanto, todos os dias oferecemos diamantes adicionais para usuários VIP no login diário, que podem ser trocados por moedas. Se você precisa de moedas, recomendamos que as compre diretamente para usá-las no chat.\nObrigado pela sua compreensão e apoio! Se tiver qualquer outra dúvida no futuro, não hesite em nos contatar novamente; estamos prontos para ajudá-lo!"]}, {"id": "c15", "cat": "pagos", "title": "Recarga con Yape", "es": ["¡Hola! ¿Cómo estás? Te informamos que los métodos de pago disponibles dependen directamente de tu ubicación y de la configuración de tu tienda de aplicaciones (Google Play Store o App Store). Para verificar si puedes utilizar Yape, por favor sigue estos pasos: Ingresa a la sección \"Recargar\" en tu perfil. Selecciona el paquete de monedas que deseas. En las opciones de pago, revisa si aparece Yape o la opción de \"Pagos Locales\". Si no visualizas la opción, significa que por ahora el sistema solo permite los métodos que aparecen listados en tu pantalla (como tarjetas de crédito, débito o saldo de la tienda). Te recomendamos usar los métodos habilitados oficialmente para asegurar que tus monedas se acrediten de inmediato. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": []}, {"id": "c16", "cat": "pagos", "title": "Recarga con PayPal", "es": ["¡Hola! ¿Cómo estás? Para poder ayudarte, te sugerimos verificar lo siguiente: Vinculación de cuenta: Asegúrate de que tu cuenta de PayPal esté correctamente vinculada a tu Google Play Store o Apple ID, ya que las recargas directas se procesan a través de sus plataformas. Fondos y tarjetas: Verifica que PayPal tenga una tarjeta válida con fondos suficientes y autorizada para pagos internacionales. Restricciones regionales: En algunos casos, PayPal puede no estar disponible como método de pago según tu región o las políticas de la tienda de aplicaciones. Por favor, envíanos una captura de pantalla del mensaje de error específico que te muestra PayPal o la tienda al intentar la transacción. ¡Estamos listos para ayudarte a resolverlo!"], "pt": []}, {"id": "c17", "cat": "pagos", "title": "Pago por Nequi", "es": ["¡Hola! Entiendo que prefieres usar Nequi para tus movimientos en la app. Te explico cómo puedes utilizarlo: Usa tu Tarjeta Nequi Visa: Entra a tu aplicación de Nequi y activa tu Tarjeta Virtual. Vincúlala a Google Play: Ve a la Play Store > Pagos y suscripciones > Métodos de pago > Agregar tarjeta de crédito o débito. Ingresa los datos de tu tarjeta Nequi. Compra en la App: Una vez vinculada, regresa a la sección de \"Recarga\" en nuestra app y selecciona el paquete que desees. El pago se descontará de tu saldo de Nequi al instante. Nota: Asegúrate de tener saldo suficiente en \"Tu Disponible\" dentro de Nequi para que la transacción sea aprobada. ¡Es la forma más sencilla de recargar en Colombia!", "¡Hola! Es muy sencillo. Si quieres usar Nequi directamente aquí en la aplicación, solo debes seguir estos pasos al momento de hacer tu compra: Ve a la sección de recarga dentro de Timo y selecciona la cantidad de monedas que deseas. Cuando se abra la ventana de pago de Google Play, toca en la flecha o en el método de pago actual para ver más opciones. Selecciona \"Añadir Nequi\" de la lista de métodos disponibles. Sigue los pasos para autorizar la vinculación con tu número de celular. ¡Listo! Una vez vinculado, podrás completar tu compra de inmediato y las monedas se cargarán a tu cuenta automáticamente. Recuerda que este es el único método seguro dentro de la plataforma para usar tu saldo de Nequi."], "pt": []}, {"id": "c18", "cat": "pagos", "title": "Pago en efectivo", "es": ["¡Hola! ¿Cómo estás? Para tener la información más precisa sobre los métodos de pago en efectivo, te recomendamos que lo confirmes directamente en la sección de \"Recargar\" dentro de la aplicación. Allí el sistema te mostrará automáticamente las opciones disponibles según tu ubicación actual, incluyendo si PagoEfectivo u otros servicios locales están habilitados para tu cuenta en este momento. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": []}, {"id": "c19", "cat": "pagos", "title": "Pagar con Mercado Pago", "es": ["¡Hola! ¿Cómo estás? Estuvimos trabajando en tu situación y con gusto te confirmamos la información sobre Mercado Pago: Actualmente, la plataforma admite diferentes métodos de pago según el país donde te encuentres. Para verificar si Mercado Pago está disponible para ti, por favor sigue estos pasos: Ve a tu perfil y toca en \"Recarga\". Selecciona el paquete de monedas que deseas adquirir. En la ventana de pago, busca la sección de \"Pagos de terceros\" o métodos alternativos. Si Mercado Pago está habilitado en tu región, aparecerá el icono correspondiente allí. Si no visualizas la opción directa de Mercado Pago, recuerda que puedes vincular tu tarjeta virtual de Mercado Pago (Mastercard) directamente a tu cuenta de Google Play o App Store para realizar la compra de forma segura y rápida. Gracias por tu tiempo y si tienes alguna pregunta contáctanos nuevamente."], "pt": []}, {"id": "c20", "cat": "pagos", "title": "Pagar con Efecty", "es": ["¡Hola! ¿Cómo estás? Para realizar tu recarga a través de Efecty, sigue estos pasos: En la sección de recargas, selecciona el paquete de monedas que deseas adquirir. Elige Efecty (o la opción de pagos locales/PSE) como tu método de pago. El sistema generará un número de convenio y un PIN o referencia de pago. Acércate a cualquier punto Efecty físico con ese número y realiza el pago en efectivo. Nota: Una vez realices el pago, las monedas suelen acreditarse en tu cuenta de forma automática. Te recomendamos guardar tu comprobante físico hasta que veas el saldo reflejado en la aplicación. ¡Gracias por tu contacto! Si tienes alguna otra duda, estamos aquí para ayudarte."], "pt": []}, {"id": "c21", "cat": "pagos", "title": "Pagar con Pix", "es": [], "pt": ["Olá! Ficamos felizes com o seu interesse em recarregar. O Pix é a forma mais rápida e segura de receber suas moedas instantaneamente. Para recarregar via Pix, siga estes passos: Vá no seu Perfil e toque em \"Recarregar\" (ícone de moeda ou carteira). Selecione a quantidade de moedas que deseja comprar. Na tela de pagamento, procure pela aba \"Pagamentos Locais\" ou diretamente pelo ícone do PIX. O sistema vai gerar um QR Code e um código \"Pix Copia e Cola\". Abra o aplicativo do seu banco, escolha a opção Pix e cole o código ou escaneie o QR Code. As moedas costumam cair na conta em poucos segundos após a confirmação do pagamento! Se encontrar qualquer dificuldade, é só nos chamar.", "Olá! Como você está?\nOs métodos de pagamento disponíveis dependem da sua localização e da configuração da sua loja de aplicativos (Google Play Store ou App Store). Por isso, a opção PIX pode não aparecer para todos os usuários.\nRecomendamos que você:\nAcesse a seção “Recarregar” no seu perfil;\nSelecione um pacote de moedas;\nVerifique as opções disponíveis em “Pagamentos locais”;\nSe o PIX não estiver visível, significa que no momento apenas os métodos exibidos na sua tela estão habilitados para sua conta.\nComo alternativa, você pode utilizar outros métodos disponíveis ou realizar sua recarga através do seguinte link oficial:\nhttps://www.timo.club/#/rechargeMall\nAgradecemos sua compreensão. Caso tenha mais dúvidas, estamos à disposição para ajudar."]}, {"id": "c22", "cat": "retiros", "title": "No me deja retirar", "es": ["¡Hola, ¿Cómo está? Cada rango de retiro tiene un límite diario/semanal de operaciones. Si el botón de retiro no está activado, puede ser porque ya ha alcanzado el límite de retiros del día/semana. Le recomendamos que intente nuevamente mañana o la próxima semana. Si la opción de retiro está 'gris', significa que no es posible realizar el retiro por los siguientes motivos: Saldo insuficiente (sus bonos disponibles no alcanzan el valor mínimo para el retiro); Límite personal alcanzado (ya ha alcanzado su número máximo de retiros permitidos); Límite global de la plataforma (se ha alcanzado el número total de retiros de todos los usuarios. Los retiros se habilitarán nuevamente el próximo lunes). Gracias por su contacto y, si tiene alguna otra pregunta, no dude en contactarnos nuevamente. ¡Tendremos mucho gusto en ayudarlo!", "¡Hola! ¿Cómo estás? Entendemos tu preocupación por la demora en recibir tu dinero, pero puedes estar tranquilo/a: tu saldo está seguro y el proceso se está realizando según los plazos habituales del banco.\n\nTe explicamos nuestros plazos de transferencia de forma sencilla:\n\nRetiros de bajo valor: Estos se verifican rápidamente y el crédito se procesa en un plazo de 3 días hábiles.\n\nRetiros de alto valor: Estos requieren una revisión manual adicional por parte de nuestro equipo financiero por motivos de seguridad. Por lo tanto, el plazo es de 7 días hábiles.\n\nNota importante: Los días hábiles no incluyen sábados, domingos ni festivos, y el plazo comienza a contar desde el día siguiente a tu solicitud.\n\nPor favor, espera a que finalice este plazo."], "pt": ["Olá, tudo bem? Cada faixa de saque tem um limite diário/semanal de operações. Se o botão de saque não estiver ativado, pode ser porque você já atingiu o limite de saques do dia/semana. Recomendamos que tente novamente amanhã ou na próxima semana. Se a opção de saque estiver \"cinza\", significa que não é possível realizar o saque pelos seguintes motivos: Saldo insuficiente (seus bônus disponíveis não atingem o valor mínimo para o saque); Limite pessoal atingido (você já atingiu seu número máximo de saques permitidos); Limite global da plataforma (o número total de saques de todos os usuários foi atingido. Os saques serão habilitados novamente na próxima segunda-feira). Obrigado pelo seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!", "Olá! Como vai? Entendemos sua preocupação com a demora no recebimento do seu dinheiro, mas fique tranquilo: seu saldo está seguro e o processo está sendo realizado de acordo com os prazos normais do banco.\nSegue uma breve explicação dos nossos prazos de transferência:\nSaques de baixo valor: São verificados rapidamente e o crédito é processado em até 3 dias úteis.\nSaques de alto valor: Requerem análise manual adicional pela nossa equipe financeira por motivos de segurança. Portanto, o prazo de processamento é de 7 dias úteis.\nObservação importante: Dias úteis não incluem sábados, domingos ou feriados, e o prazo de processamento começa a contar a partir do dia seguinte ao envio da sua solicitação.\n\nPor favor, aguarde até o término desse prazo."]}, {"id": "c23", "cat": "retiros", "title": "Cómo retirar", "es": ["¡Hola! Es genial que ya estés lista para retirar tus ganancias. Aquí tienes los pasos detallados para hacerlo de forma correcta: Entra a tu perfil: Haz clic en el icono \"Yo\" en la esquina inferior derecha. Ve a Ingresos: Selecciona la pestaña que dice \"Ingresos\". Allí verás tu saldo total de diamantes. Selecciona Retirar: Toca el botón de \"Retirar\". Verás diferentes montos disponibles (por ejemplo, desde USD 10 en adelante). Configura tu método: • Si es tu primera vez, haz clic en \"Método de recepción\". Elige tu opción (PayPal o Transferencia Bancaria según tu país). Muy importante: Asegúrate de que los datos (correo o número de cuenta) sean correctos. Si usas correos, que sean todos en minúsculas y sin espacios. Confirma: Una vez seleccionado el monto y el método, dale a confirmar. Recuerda: Los retiros pequeños tardan hasta 3 días hábiles. Los retiros grandes (como de USD 200) tardan hasta 7 días hábiles. Los mejores días para retirar son los lunes, para evitar alcanzar los límites globales de la plataforma. ¡Felicidades por tus ganancias!"], "pt": ["Olá! É ótimo que você já esteja pronta para sacar seus ganhos. Aqui estão os passos detalhados para fazê-lo de forma correta:\nEntre no seu perfil: Clique no ícone \"Eu\" no canto inferior direito.\nVá em Rendimentos: Selecione a aba que diz \"Rendimentos\". Lá você verá seu saldo total de diamantes.\nSelecione Sacar: Toque no botão de \"Sacar\". Você verá diferentes valores disponíveis (por exemplo, a partir de USD 10 em diante).\nConfigure seu método: Se for sua primeira vez, clique em \"Método de recebimento\". Escolha sua opção (PayPal ou Transferência Bancária, conforme seu país).\nMuito importante: Certifique-se de que os dados (e-mail ou número de conta) estejam corretos. Se usar e-mails, que sejam todos em minúsculas e sem espaços.\nConfirme: Uma vez selecionado o valor e o método, clique em confirmar.\nLembre-se: Os saques pequenos levam até 3 dias úteis. Os saques grandes (como de USD 200) levam até 7 dias úteis. Os melhores dias para sacar são as segundas-feiras, para evitar atingir os limites globais da plataforma. Parabéns pelos seus ganhos!"]}, {"id": "c24", "cat": "retiros", "title": "Fallo del retiro", "es": [], "pt": ["Olá, tudo bem? Os diamantes envolvidos em ordens de saque falhas serão devolvidos à conta do usuário. Se seus diamantes não foram devolvidos ou se sua ordem de saque foi congelada, por favor, forneça as seguintes informações detalhadas:\nSeu ID de usuário\nPrint da tela mostrando a ordem de saque falhada/congelada\nDados da conta de recebimento do saque\nObrigado pelo seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!"]}, {"id": "c25", "cat": "chat", "title": "No llegan mensajes", "es": ["¡Hola! ¿Cómo estás? Si no estás recibiendo mensajes, te recomendamos verificar primero si tu cuenta tiene alguna sanción activa, ya que esto restringe la entrada de nuevos chats durante el periodo de penalización. También es muy importante que revises tu nivel de conversación; recuerda que al subir de nivel, la plataforma te otorga mayor visibilidad y flujo de usuarios. Si tu cuenta está en orden y aun así no recibes mensajes, por favor contacta al servicio al cliente para que podamos revisar si existe algún problema técnico con tu perfil y te ayuden a solucionarlo de manera inmediata. ¡Saludos!", "¡Hola! Entiendo que puede ser frustrante no recibir mensajes, pero no te preocupes, esto no suele ser un error técnico, sino que depende de la actividad en tu perfil. Aquí te doy unos consejos y verificaciones para que vuelvas a tener mucho movimiento: Inicia la conversación: El volumen de tus mensajes está directamente relacionado con tu actividad. ¡No esperes a que te escriban! Elige perfiles que te interesen e inicia tú las conversaciones. Participa en la comunidad: Únete a una \"tribu\" o entra en \"salas de chat\". Estos son ambientes gratuitos donde puedes socializar y hacer que más personas vean tu perfil. Mejora tu perfil: Publica momentos o fotos positivas. Mientras más contenido tengas, más exposición te dará el sistema y más usuarios querrán conocerte. Verifica el \"Modo No Molestar\": Ve a \"Yo\" -> \"Ajustes\" -> \"Ajustes generales\" y asegúrate de que no tienes activada la opción de \"No molestar\", ya que esto podría estar filtrando tus mensajes de personas que aún no son tus amigos. ¡Intenta interactuar con más usuarios hoy mismo y verás cómo el volumen de mensajes empieza a subir!", "¡Hola! ¿Cómo está? El volumen de sus mensajes está relacionado con su actividad. No se preocupe, ya que es normal que esta cantidad aumente o disminuya. Puede elegir perfiles que le interesen para interactuar e iniciar conversaciones o unirse a la tribu. ¡Agradecemos su comprensión y apoyo! Si tiene alguna otra pregunta en el futuro, no dude en ponerse en contacto con nosotros nuevamente, y estamos listos para ayudarlo!"], "pt": ["Olá! Tudo bem? Se você não está recebendo mensagens, recomendamos verificar primeiro se sua conta tem alguma sanção ativa, pois isso restringe a entrada de novos chats durante o período de penalização. Também é muito importante que você revise seu nível de conversação; lembre-se que ao subir de nível, a plataforma lhe concede maior visibilidade e fluxo de usuários. Se sua conta estiver em ordem e, mesmo assim, não receber mensagens, por favor, contate o serviço de atendimento ao cliente para que possamos revisar se existe algum problema técnico com seu perfil e ajudá-lo a resolvê-lo de imediato. Saudações!", "Olá! Entendo que pode ser frustrante não receber mensagens, mas não se preocupe, isso não costuma ser um erro técnico, mas sim depende da atividade no seu perfil. Aqui deixo algumas dicas e verificações para que você volte a ter muito movimento:\nInicie a conversa: O volume das suas mensagens está diretamente relacionado à sua atividade. Não espere que te escrevam! Escolha perfis que te interessem e inicie você as conversas.\nParticipe da comunidade: Junte-se a uma \"tribo\" ou entre em \"salas de chat\". Estes são ambientes gratuitos onde você pode socializar e fazer com que mais pessoas vejam seu perfil.\nMelhore seu perfil: Publique momentos ou fotos positivas. Quanto mais conteúdo você tiver, mais exposição o sistema lhe dará e mais usuários quererão te conhecer.\nVerifique o \"Modo Não Perturbe\": Vá em \"Eu\" -> \"Ajustes\" -> \"Ajustes gerais\" e certifique-se de que não está com a opção \"Não perturbe\" ativada, pois isso poderia estar filtrando suas mensagens de pessoas que ainda não são seus amigos. Tente interagir com mais usuários hoje mesmo e verá como o volume de mensagens começa a subir!", "Olá! Tudo bem? O volume das suas mensagens está relacionado à sua atividade. Não se preocupe, pois é normal que essa quantidade aumente ou diminua. Você pode escolher perfis que te interessem para interagir e iniciar conversas ou se juntar à tribo. Agradecemos a sua compreensão e apoio! Se tiver qualquer outra dúvida no futuro, não hesite em nos contatar novamente; estamos prontos para ajudá-lo!"]}, {"id": "c26", "cat": "chat", "title": "No se envían los mensajes", "es": ["¡Hola! ¿Cómo estás? Si la conversación no continúa o no puedes enviar mensajes, es posible que sea porque sus monedas se han agotado. Para continuar chateando con sus amigos, necesita recargar más monedas. Puede ir a la página \"Yo\" -> \"Monedas\" para elegir el paquete que prefiera y realizar la recarga. ¡Gracias por su contacto y que tenga un buen día!"], "pt": ["Olá! Tudo bem? Se a conversa não continuar ou se você não conseguir enviar mensagens, é possível que seja porque suas moedas acabaram. Para continuar conversando com seus amigos, você precisa recarregar mais moedas. Você pode ir à página \"Eu\" -> \"Moedas\" para escolher o pacote que preferir e realizar a recarga. Obrigado pelo seu contato e tenha um bom dia!"]}, {"id": "c27", "cat": "chat", "title": "Por qué cobran por mensajes", "es": ["¡Hola, ¿cómo está? Para evitar que los usuarios reciban mensajes en exceso y aumentar la probabilidad de éxito en las interacciones sociales, en ciertos escenarios de la plataforma, iniciar conversaciones por texto, voz o vídeo consumirá una cantidad específica de monedas. De esta forma, quien inicia la conversación valorizará más la oportunidad de interacción, lo que también ayuda en la filtración entre usuarios. Puedes: Enviar temas interesantes y divertidos para involucrar; Cuando ambos se sigan y se conviertan en amigos, los mensajes privados no tendrán costo; Utilizar ambientes gratuitos como 'famílias' ou 'salas de chat' para socializar. ¡Agradecemos su comprensión y comentarios! ¡Esperamos que disfrute de la experiencia de hacer amigos en TIMO!"], "pt": ["Olá, tudo bem? Para evitar que os usuários recebam mensagens em excesso e aumentar a probabilidade de sucesso nas interações sociais, em certos cenários da plataforma, iniciar conversas por texto, voz ou vídeo consumirá uma quantidade específica de moedas. Desta forma, quem inicia a conversa valorizará mais a oportunidade de interação, o que também ajuda na filtragem entre usuários. Você pode:\nEnviar temas interessantes e divertidos para engajar;\nQuando ambos se seguirem e se tornarem amigos, as mensagens privadas não terão custo;\nUtilizar ambientes gratuitos como 'famílias' ou 'salas de chat' para socializar.\nAgradecemos a sua compreensão e comentários! Esperamos que desfrute da experiência de fazer amigos no TIMO!"]}, {"id": "c28", "cat": "chat", "title": "Envío de información personal", "es": ["¡Hola! ¿Cómo estás? Entiendo que puede resultar frustrante no poder compartir tu número de celular o redes sociales directamente cuando conectas con alguien, pero esta restricción existe por razones fundamentales de seguridad y protección para todos los miembros: Protección de Datos Personales: Al mantener la comunicación dentro de la aplicación, protegemos tu privacidad y la de la otra persona. Compartir información personal de forma prematura puede exponerte a situaciones de acoso, estafas o uso indebido de tu información fuera de nuestro control. Seguridad de la Comunidad: Nuestro equipo de moderación puede actuar y protegerte ante cualquier comportamiento inapropiado siempre que ocurra dentro de la plataforma. Una vez que la conversación se traslada a WhatsApp o redes externas, perdemos la capacidad de intervenir en caso de un reporte de seguridad. Prevención de Fraudes: El bloqueo de datos de contacto ayuda a prevenir actividades fraudulentas o transacciones fuera del sistema seguro de la aplicación, garantizando que todas las interacciones sean legítimas. si tiene alguna otra pregunta, ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!", "¡Hola! ¿Cómo estás? Lamentamos la situación, pero te informamos que compartir números de teléfono, redes sociales o cualquier dato de contacto externo está estrictamente prohibido dentro de la plataforma por razones de seguridad. Esta es una norma fundamental de nuestra comunidad y el sistema de moderación aplica la congelación de la cuenta como consecuencia directa de haber detectado este comportamiento. Una vez que el sistema registra este intercambio de información, la cuenta queda restringida para proteger la integridad de los usuarios. Te recomendamos respetar estas políticas en el futuro para evitar sanciones permanentes y mantener un entorno seguro para todos. Le agradecemos su comprensión. ¡Saludos!"], "pt": ["Olá! Tudo bem? Entendo que pode ser frustrante não poder compartilhar seu número de celular ou redes sociais diretamente quando você se conecta com alguém, mas esta restrição existe por razões fundamentais de segurança e proteção para todos os membros: Proteção de Dados Pessoais: Ao manter a comunicação dentro do aplicativo, protegemos a sua privacidade e a da outra pessoa. Compartilhar informações pessoais de forma prematura pode expor você a situações de assédio, golpes ou uso indevido da sua informação fora do nosso controle. Segurança da Comunidade: Nossa equipe de moderação pode agir e proteger você contra qualquer comportamento inapropriado, desde que ocorra dentro da plataforma. Uma vez que a conversa é transferida para o WhatsApp ou redes externas, perdemos a capacidade de intervir em caso de um relatório de segurança. Prevenção de Fraudes: O bloqueio de dados de contato ajuda a prevenir atividades fraudulentas ou transações fora do sistema seguro do aplicativo, garantindo que todas as interações sejam legítimas. Se tiver qualquer outra dúvida, entre em contato conosco novamente. Teremos muito prazer em ajudá-lo!", "Olá! Tudo bem? Lamentamos a situação, mas informamos que compartilhar números de telefone, redes sociais ou qualquer dado de contato externo é estritamente proibido dentro da plataforma por razões de segurança. Esta é uma norma fundamental da nossa comunidade e o sistema de moderação aplica o congelamento da conta como consequência direta de ter detectado este comportamento. Uma vez que o sistema registra essa troca de informações, a conta fica restrita para proteger a integridade dos usuários. Recomendamos respeitar estas políticas no futuro para evitar sanções permanentes e manter um ambiente seguro para todos. Agradecemos a sua compreensão. Saudações!"]}, {"id": "c29", "cat": "chat", "title": "Salir de una sala", "es": [], "pt": ["Olá, tudo bem? Para sair da sala, basta tocar no botão que aparece na parte superior direita da sua tela. Esse é o botão de saída direta. Ao tocá-lo, o aplicativo permitirá que você abandone a sala imediatamente para retornar ao menu principal ou minimizá-la. Se, por algum motivo, ao pressioná-lo nada acontecer, tente o seguinte:\nPressione firmemente: Certifique-se de tocar exatamente sobre o ícone.\nReinicie se congelar: Se o botão não reagir, é possível que o aplicativo tenha travado. Nesse caso, feche o app completamente e entre novamente.\nObrigado pelo seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Estaremos felizes em ajudá-lo!"]}, {"id": "c30", "cat": "cuenta", "title": "Cambio de Gmail / Facebook / teléfono", "es": ["Hola, nos disculpamos por no poder ayudarte con este problema, pero puedes dejar un mensaje y proporcionarnos con la siguiente información para ponerte en contacto con nuestro Servicio de Atención al Cliente: Si necesitas cambiar tu cuenta de Gmail / Facebook / Número de teléfono: Correo electrónico / Facebook / Número de teléfono antiguo: Correo electrónico / Facebook / Nuevo número de teléfono: Foto real (sin filtro de belleza o maquillaje): ID / Licencia de conducir (solo para verificación en la plataforma). Por favor ponte en contacto con ellos para que te puedan ayudar a tu solicitud."], "pt": ["Olá, pedimos desculpas por não podermos ajudá-lo com este problema diretamente, mas você pode deixar uma mensagem e nos fornecer as seguintes informações para entrar em contato com nosso Serviço de Atendimento ao Cliente:\nSe você precisa alterar sua conta de Gmail / Facebook / Número de telefone:\nE-mail / Facebook / Número de telefone antigo:\nE-mail / Facebook / Novo número de telefone:\nFoto real (sem filtro de beleza ou maquiagem):\nID / Carteira de motorista (apenas para verificação na plataforma).\nPor favor, entre em contato com eles para que possam ajudá-lo com sua solicitação."]}, {"id": "c31", "cat": "cuenta", "title": "Cambio de región o lugar", "es": ["¡Hola! ¿Cómo estás? Lamentamos los inconvenientes, pero te informamos que la región de la cuenta no se puede cambiar una vez establecida; esta debe configurarse correctamente desde el momento de la creación de la cuenta. ¡Agradecemos tu comprensión!"], "pt": ["Olá! Tudo bem? Lamentamos os transtornos, mas informamos que a região da conta não pode ser alterada uma vez estabelecida; esta deve ser configurada corretamente desde o momento da criação da conta. Agradecemos a sua compreensão!"]}, {"id": "c32", "cat": "cuenta", "title": "Cambiar género", "es": ["¡Hola! ¿Cómo estás? Entendemos perfectamente la situación. Queremos informarte que, por políticas de seguridad de la plataforma, normalmente no ofrecemos servicios de modificación de género a cualquier usuario una vez registrado. En este caso, lo más recomendable para que tu perfil cuente con la información correcta es que puedas cancelar tu cuenta actual y volver a realizar el registro con el género deseado. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": ["Olá! Tudo bem? Entendemos perfeitamente a situação. Queremos informar que, por políticas de segurança da plataforma, normalmente não oferecemos serviços de modificação de gênero a qualquer usuário após o registro. Neste caso, o mais recomendável para que seu perfil conte com a informação correta é que você possa cancelar sua conta atual e realizar o registro novamente com o gênero desejado. Agradecemos o seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!"]}, {"id": "c33", "cat": "cuenta", "title": "Cambiar fecha de nacimiento", "es": [], "pt": ["Olá, tudo bem? Compreendo que queira atualizar seus dados, mas informo que, por motivos de segurança e para cumprir as políticas de proteção da comunidade, não é possível alterar sua data de nascimento uma vez que ela tenha sido registrada. Esta configuração é permanente para garantir que a idade declarada no momento da criação da conta seja a correta. Sugiro que revise se o restante das suas informações no perfil está atualizado, já que outros dados, como seu apelido ou foto de perfil, podem ser modificados. Lamento os transtornos que isso possa lhe causar, mas é uma medida necessária para manter a segurança de todos os usuários dentro do aplicativo."]}, {"id": "c34", "cat": "cuenta", "title": "No se puede elegir los match o conexiones", "es": ["¡Hola! ¿Cómo estás? El sistema funciona de una manera especifica: normalmente aparecerán los perfiles del sexo contrario al género que seleccionaste al momento de crear tu perfil. No hay una opción manual para cambiar esto una vez configurado el género de la cuenta. Por favor, asegúrese de que el género de su perfil sea el correcto para que el sistema le muestre a las personas que desea conocer. ¡Cualquier otra duda, aquí estamos!"], "pt": ["Olá! Tudo bem? O sistema funciona de uma maneira específica: normalmente aparecerão os perfis do sexo contrário ao gênero que você selecionou no momento de criar seu perfil. Não há uma opção manual para mudar isso uma vez configurado o gênero da conta. Por favor, certifique-se de que o gênero do seu perfil esteja correto para que o sistema lhe mostre as pessoas que deseja conhecer. Qualquer outra dúvida, aqui estamos!"]}, {"id": "c35", "cat": "cuenta", "title": "Eliminar cuenta", "es": ["¡Hola! ¿Cómo estás? Entendemos que deseas proceder con la eliminación de tu cuenta. Tal como mencionas, el proceso se realiza directamente desde tu perfil siguiendo estos pasos: Ingresa a tu perfil y toca el icono de Configuración (el engranaje). Selecciona el apartado de \"Seguridad de la cuenta\". En la parte inferior de esa página, encontrarás el botón \"Eliminar cuenta\". Haz clic en él y sigue las instrucciones finales que te indica el sistema para confirmar la solicitud. Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": ["Olá! Tudo bem? Entendemos que você deseja prosseguir com a exclusão da sua conta. Como você mencionou, o processo é realizado diretamente do seu perfil seguindo estes passos: Entre no seu perfil e toque no ícone de Configurações (a engrenagem). Selecione a seção de \"Segurança da conta\". Na parte inferior dessa página, você encontrará o botão \"Excluir conta\". Clique nele e siga as instruções finais indicadas pelo sistema para confirmar a solicitação. Agradecemos o seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar novamente. Teremos muito prazer em ajudá-lo!"]}, {"id": "c36", "cat": "tribu", "title": "Tribu: restricción por salir de clanes", "es": ["¡Hola! ¿Cómo estás? Estuvimos trabajando en tu situación y verificamos qué está sucediendo con tu acceso. Tras revisar el sistema, confirmamos que debido a que has salido de clanes con frecuencia recientemente, se ha generado una restricción automática. Esto es una medida de seguridad del aplicativo para evitar inestabilidad en los grupos. Para solucionar esto, ten en cuenta lo siguiente: Espera de seguridad: El sistema requiere que intentes unirte a un clan nuevamente en unos días. Es un bloqueo temporal que no puede saltarse manualmente. Estabilidad: Te recomendamos que, una vez puedas ingresar a una nueva Tribu, evites salir de ella de forma constante para que el algoritmo no vuelva a limitar tus acciones. Sincronización: Pasado el tiempo de espera (normalmente de 48 a 72 horas), la opción de \"Unirse\" se habilitará de nuevo automáticamente en tu perfil. Por favor, intenta ingresar nuevamente en un par de días. Si el problema persiste después de ese tiempo, no dudes en escribirnos. Gracias por tu tiempo y si tienes alguna pregunta contáctanos nuevamente."], "pt": ["Olá! Tudo bem? Estivemos trabalhando na sua situação e verificamos o que está acontecendo com seu acesso. Após revisar o sistema, confirmamos que, devido ao fato de você ter saído de clãs com frequência recentemente, foi gerada uma restrição automática. Esta é uma medida de segurança do aplicativo para evitar instabilidade nos grupos. Para resolver isso, considere o seguinte:\nEspera de segurança: O sistema exige que você tente se juntar a um clã novamente em alguns dias. É um bloqueio temporário que não pode ser pulado manualmente.\nEstabilidade: Recomendamos que, assim que puder entrar em uma nova Tribu, evite sair dela constantemente para que o algoritmo não volte a limitar suas ações.\nSincronização: Passado o tempo de espera (normalmente de 48 a 72 horas), a opção de \"Participar\" será habilitada novamente de forma automática no seu perfil.\nPor favor, tente entrar novamente em um par de dias. Se o problema persistir após esse tempo, não hesite em nos escrever. Obrigado pelo seu tempo e, se tiver alguma dúvida, contate-nos novamente."]}, {"id": "c37", "cat": "tribu", "title": "Problemas en la Tribu (fallos y videollamadas)", "es": ["¡Hola! Lamentamos los inconvenientes técnicos que está experimentando. Los fallos en la Tribu y el cierre repentino de las videollamadas suelen estar relacionados con la estabilidad de su conexión a internet o la capacidad de procesamiento de su dispositivo. Para mejorar su experiencia, le sugerimos realizar las siguientes verificaciones: Estabilidad de Red: Las funciones de Tribu y videollamada requieren una conexión constante. Si usted utiliza Wi-Fi, intente acercarse al router o cambiar a datos móviles (y viceversa) para descartar intermitencias en la señal. Cierre de Procesos: Antes de iniciar una videollamada o entrar a una Tribu, asegúrese de cerrar todas las demás aplicaciones de su teléfono. Esto liberará memoria RAM para que la aplicación no se cierre sola. Ajustes de Notificaciones: Si no le llegan los mensajes, verifique en los ajustes de su teléfono que la aplicación tenga todos los permisos de notificación activos y que no se encuentre en \"Modo Ahorro de Energía\". Le agradecemos su contacto y, si tiene alguna otra pregunta, no dude en ponerse en contacto con nosotros nuevamente."], "pt": []}, {"id": "c38", "cat": "tribu", "title": "Salir de una Tribu", "es": [], "pt": ["Olá, amentamos muito que você não tenha se sentido bem tratada na sua agência atual. Priorizamos o respeito em nossa comunidade e ninguém deve passar por situações desagradáveis.\nSobre os seus pedidos, aqui estão os caminhos:\nPara sair da Tribo: Entre na página da Tribo, clique nos três pontos no canto superior direito e selecione \"Sair da Tribo\". Isso é imediato.\nDenúncia: Se você sofreu algum tipo de abuso ou tratamento inadequado, por favor, envie-nos prints das conversas. Levamos o comportamento das agências muito a sério e podemos aplicar sanções se as regras de conduta forem violadas.\nAssim que você estiver livre da agência, poderá se juntar a novas tribos e grupos que combinem mais com o seu perfil!"]}, {"id": "c39", "cat": "tribu", "title": "Salida de una agencia", "es": ["¡Hola! Buenas tardes. Hemos recibido su solicitud. Lamentamos las molestias, pero le informamos formalmente que no disponemos de la opción de desvincular su cuenta a través de nuestro departamento de soporte. Una vez vinculada la cuenta, el sistema no permite la desconexión manual por nuestra parte.\n\nPor este motivo, deberá ponerse en contacto directamente con el responsable de su agencia para que procese su baja del sistema.\n\nGracias por su comprensión."], "pt": ["Olá! Boa tarde. Recebemos sua solicitação. Lamentamos os transtornos, mas informamos formalmente que não contamos com a opção de desvinculação pelo nosso departamento de suporte. Uma vez que a conta foi vinculada, o sistema não permite a ruptura manual por nossa parte.\nPor esse motivo, você deve chegar a um acordo direto com o líder da sua agência para que eles possam efetuar a sua saída no sistema.\nAgradecemos a sua compreensão."]}, {"id": "c40", "cat": "tribu", "title": "Crear agencia (requisito de invitados)", "es": [], "pt": ["Olá! Como você está? Entendemos que você está focado em abrir sua própria agência e estamos aqui para orientar sobre este requisito importante.\nPara avançar no processo de se tornar um agente oficial, é necessário demonstrar sua capacidade de liderança e recrutamento. O primeiro passo fundamental é convidar 30 novos usuários utilizando o seu próprio código de convite exclusivo. Isso valida sua atividade e ajuda a construir a base da sua futura agência.\nDicas para completar este requisito:\nCompartilhe seu Código: Envie seu link ou código de convite para pessoas interessadas em trabalhar ou interagir na plataforma.\nAcompanhe o Progresso: Você pode verificar quantos usuários já se registraram através do seu código na seção de convites do seu perfil.\nPróxima Etapa: Assim que atingir a meta de 30 novos usuários, entre em contato conosco novamente para darmos continuidade à abertura da sua agência.\nEstamos aqui para ajudar você! Foque em convidar usuários ativos para fortalecer sua rede desde o início."]}, {"id": "c41", "cat": "tribu", "title": "Abrir agencia (requisitos Brasil)", "es": [], "pt": ["Para abertura de agências aqui na TIMO, temos os seguintes requisitos:\n- Agência reconhecida em ao menos 1 app de proposta similar;\n- Não ter código de convite (Tendo sido convidado) associado à conta;\n- Ter ao menos 10 hosts, ou realizar o recrutamento em até 7 dias.\nCaso cumpra os requisitos necessários, por favor, entre em contato com seu telefone de contato, e-mail e nome para tratamento."]}, {"id": "c42", "cat": "general", "title": "Problema incompleto", "es": ["¡Hola! ¿Cómo estás? ¿Podrías describir con más detalle en qué parte exactamente está ocurriendo el problema? Si es posible, adjunte una captura de pantalla para que podamos resolverlo de la mejor manera posible. ¡Agradecemos su comprensión y apoyo! Si tiene alguna otra pregunta en el futuro, no dude en ponerse en contacto con nosotros nuevamente, y estamos listos para ayudarlo!"], "pt": ["Olá! Tudo bem? Você poderia descrever com mais detalhes em qual parte exatamente está ocorrendo o problema? Se possível, anexe uma captura de tela para que possamos resolver o problema da melhor maneira possível. Agradecemos a sua compreensão e apoio! Se tiver qualquer outra dúvida no futuro, não hesite em nos contatar novamente; estamos prontos para ajudá-lo!"]}, {"id": "c43", "cat": "general", "title": "Ya se respondió el otro comentario", "es": ["¡Hola! ¿Cómo estás? Gracias por contactarnos. La respuesta a tu otro comentario ya se envió. Por favor, revísala. ¡Gracias por tu comprensión y apoyo! Si tienes alguna otra pregunta, no dudes en contactarnos nuevamente; ¡estamos listos para ayudarte!"], "pt": ["Olá! Tudo bem? Obrigado por entrar em contato conosco. A resposta foi enviada no seu outro comentário. Por favor, verifique. Agradecemos pela sua compreensão e apoio! Caso tenha qualquer outra dúvida no futuro, não hesite em nos contatar novamente; estamos prontos para ajudar!"]}, {"id": "c44", "cat": "general", "title": "Comentario inválido (solo temas de la app)", "es": [], "pt": ["Bom dia! Gostaríamos de informar que, neste canal, nossa equipe oferece suporte exclusivamente para questões relacionadas ao aplicativo."]}, {"id": "c45", "cat": "general", "title": "Sugerencia / opinión sobre la app", "es": ["¡Hola, ¿Cómo está? Sus comentarios y sugerencias son extremadamente importantes y valiosos para nosotros. Registraremos cuidadosamente los comentarios de cada usuario y los consolidaremos periódicamente para las equipos de producto responsables. Nuestro objetivo es proporcionar una plataforma divertida y agradable para todos los usuarios. ¡Preste atención a las futuras optimizaciones de funcionalidades!\n\nGracias por su contacto y, si tiene alguna otra pregunta, no dud
