e en ponerse en contacto con nosotros nuevamente. ¡Tendremos mucho gusto en ayudarlo!"], "pt": ["Olá, tudo bem? Seus comentários e sugestões são extremamente importantes e valiosos para nós. Registraremos cuidadosamente o feedback de cada usuário e os consolidaremos periodicamente para as equipes de produto responsáveis. Nosso objetivo é proporcionar uma plataforma divertida e agradável para todos os usuários. Prepare-se para as futuras otimizações de funções!\nObrigado pelo seu contato e, se tiver qualquer outra dúvida, não hesite em nos contatar de novo. Teremos muito prazer em ajudá-lo!"]}, {"id": "c46", "cat": "general", "title": "Opinión positiva", "es": [], "pt": ["Olá! Como você está?\nFicamos muito felizes em saber que você está gostando do aplicativo! Seus comentários são extremamente importantes e valiosos para nós.\nRegistraremos cuidadosamente o seu feedback e o compartilharemos com as equipes responsáveis. Nosso objetivo é continuar melhorando e proporcionando a melhor experiência possível para todos os usuários.\nAgradecemos pelo seu apoio! Caso tenha alguma sugestão ou dúvida, estamos à disposição para ajudar."]}, {"id": "c47", "cat": "general", "title": "Opinión de usuarios y creadores", "es": [], "pt": ["Olá! Como você está? Agradecemos por partilhares a tua visão connosco. Valorizamos muito a tua opinião e o teu feedback sobre o funcionamento da aplicação.\nEstamos constantemente a trabalhar para ouvir os nossos usuários e criadores, pois o teu ponto de vista ajuda-nos a entender como podemos evoluir. Registámos o teu comentário e ele será levado em conta nas nossas futuras avaliações de melhoria da plataforma.\nAgradecemos por fazeres parte da nossa comunidade!"]}]};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
function valid(o){return !!o&&Array.isArray(o.cats)&&Array.isArray(o.cases)&&o.cases.every(c=>typeof c.title==='string'&&Array.isArray(c.es)&&Array.isArray(c.pt)&&o.cats.some(k=>k.id===c.cat))}
function load(){try{const o=JSON.parse(localStorage.getItem('casos_v1'));if(valid(o))return o}catch(e){}return clone(ORIG)}
let D=load();
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function idx(c){const k=D.cats.find(x=>x.id===c.cat);c.h=norm([c.title,k?k.name:'',c.note||'',...c.es,...c.pt].join(' '))}
D.cases.forEach(idx);
const S={q:'',lang:'both',cat:'all',open:new Set()};
try{const l=localStorage.getItem('lang');if(l)S.lang=l}catch(e){}
const LN={es:'Español',pt:'Português'};
function match(c,ignoreCat){
  if(S.lang!=='both'&&!c[S.lang].length)return false;
  if(!ignoreCat&&S.cat!=='all'&&c.cat!==S.cat)return false;
  return norm(S.q).split(/\s+/).filter(Boolean).every(t=>c.h.includes(t));
}
function block(c,l,i){
  return `<div class="lb"><div class="lh"><span class="lg ${l}">${LN[l]}</span><button class="cp" data-id="${c.id}" data-l="${l}" data-i="${i}">Copiar</button></div><pre>${esc(c[l][i])}</pre></div>`;
}
function body(c){
  const ls=S.lang==='both'?['es','pt'].filter(l=>c[l].length):[S.lang];
  let h=c.note?`<div class="note">${esc(c.note)}</div>`:'';
  if(ls.length===2&&c.es.length===c.pt.length){
    c.es.forEach((_,i)=>{h+=(c.es.length>1?`<div class="vh">Variante ${i+1}</div>`:'')+`<div class="cols">${block(c,'es',i)}${block(c,'pt',i)}</div>`});
  }else ls.forEach(l=>{
    c[l].forEach((_,i)=>{h+=(c[l].length>1?`<div class="vh">${LN[l]}: variante ${i+1}</div>`:'')+`<div class="cols">${block(c,l,i)}</div>`});
  });
  return h+`<div class="act"><button data-ed="${c.id}">Editar</button></div>`;
}
function tags(c){
  let t='';
  if(c.isNew)t+='<span class="tag new">Nuevo</span>';
  if(!c.pt.length)t+='<span class="tag es">Solo ES</span>';
  if(!c.es.length)t+='<span class="tag pt">Solo PT</span>';
  const n=Math.max(c.es.length,c.pt.length);
  if(n>1)t+=`<span class="tag n">${n} variantes</span>`;
  return t;
}
function render(){
  const vis=D.cases.filter(c=>match(c));
  $('#cnt').textContent=`${vis.length} de ${D.cases.length} casos`;
  $('#chips').innerHTML=[['all','Todos']].concat(D.cats.map(c=>[c.id,c.name])).map(([id,n])=>{
    const k=D.cases.filter(c=>match(c,true)&&(id==='all'||c.cat===id)).length;
    return `<button data-cat="${id}" aria-pressed="${S.cat===id}">${n}<span>${k}</span></button>`}).join('');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  let h='';
  D.cats.forEach(cat=>{
    const cs=vis.filter(c=>c.cat===cat.id);
    if(!cs.length)return;
    h+=`<h2>${cat.name}</h2>`+cs.map(c=>`<details data-id="${c.id}"${S.open.has(c.id)?' open':''}><summary><span class="t">${esc(c.title)}</span>${tags(c)}</summary><div class="b">${S.open.has(c.id)?body(c):''}</div></details>`).join('');
  });
  $('#list').innerHTML=h||`<div class="empty">No hay casos que coincidan${S.q?` con “${esc(S.q)}”`:''}.<br>Prueba con otra palabra, cambia de idioma o quita la categoría.<br><button id="clr">Limpiar filtros</button></div>`;
}
document.addEventListener('toggle',e=>{
  const d=e.target;if(!d.matches||!d.matches('details[data-id]'))return;
  const id=d.dataset.id,c=D.cases.find(x=>x.id===id);
  if(d.open){S.open.add(id);const b=d.querySelector('.b');if(!b.firstChild)b.innerHTML=body(c)}else S.open.delete(id);
},true);
$('#q').addEventListener('input',e=>{
  S.q=e.target.value;
  const v=D.cases.filter(c=>match(c));
  if(S.q&&v.length<=5)v.forEach(c=>S.open.add(c.id));
  render();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.ed)openForm(D.cases.find(x=>x.id===t.dataset.ed));
  else if(t.id==='newc')openForm(null);
  else if(t.id==='catb')openCats();
  else if(t.id==='bkb')openBackup();
  else if(t.dataset.cat){S.cat=t.dataset.cat;render()}
  else if(t.closest('.seg')){S.lang=t.dataset.l;try{localStorage.setItem('lang',S.lang)}catch(_){}render()}
  else if(t.id==='all'){D.cases.filter(c=>match(c)).forEach(c=>S.open.add(c.id));render()}
  else if(t.id==='none'){S.open.clear();render()}
  else if(t.id==='clr'){S.q='';S.cat='all';$('#q').value='';render()}
  else if(t.classList.contains('cp')){
    const c=D.cases.find(x=>x.id===t.dataset.id),txt=c[t.dataset.l][+t.dataset.i];
    copy(txt).then(()=>{t.textContent='Copiado';t.classList.add('ok');setTimeout(()=>{t.textContent='Copiar';t.classList.remove('ok')},1500)});
  }
});
function copy(txt){
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt).catch(fb);
  fb();return Promise.resolve();
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  else if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').blur()}
});

const qa=s=>esc(s).replace(/"/g,'&quot;');
const snap=()=>({cats:D.cats,cases:D.cases.map(({h,...r})=>r)});
const sig=c=>JSON.stringify([c.title,c.cat,c.note||'',!!c.isNew,c.es,c.pt]);
let tt,cur='',pending=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function persist(){try{localStorage.setItem('casos_v1',JSON.stringify(snap()))}catch(e){toast('No se pudo guardar en este navegador. Usa Respaldo para copiar tus datos.')}}
function commit(m){D.cases.forEach(idx);if(S.cat!=='all'&&!D.cats.some(c=>c.id===S.cat))S.cat='all';persist();render();if(m)toast(m)}
const dlg=$('#dlg');
function show(h){$('#dbody').innerHTML=h;if(!dlg.open)dlg.showModal()}
function ask(msg,act,label){show(`<h3>${msg}</h3><div class="dact"><span class="sp"></span><button data-a="x">Cancelar</button><button class="danger" data-a="${act}">${label}</button></div>`)}
function vrow(es,pt,i){return `<div class="vr"><div class="vrh"><b>Variante ${i+1}</b><button class="sm" data-a="rm">Quitar</button></div><div class="cols"><label>Español<textarea data-f="es" rows="7">${esc(es)}</textarea></label><label>Português<textarea data-f="pt" rows="7">${esc(pt)}</textarea></label></div></div>`}
function openForm(c){
  cur=c?c.id:'';
  const n=c||{cat:S.cat!=='all'?S.cat:D.cats[0].id,title:'',es:[],pt:[],note:'',isNew:false};
  const m=Math.max(n.es.length,n.pt.length,1);let rows='';
  for(let i=0;i<m;i++)rows+=vrow(n.es[i]||'',n.pt[i]||'',i);
  const opts=D.cats.map(x=>`<option value="${x.id}"${x.id===n.cat?' selected':''}>${esc(x.name)}</option>`).join('')+'<option value="__new">+ Nueva categoría…</option>';
  const o=c&&ORIG.cases.find(x=>x.id===c.id);
  show(`<h3>${c?'Editar caso':'Nuevo caso'}</h3>
<label>Título<input id="f-t" value="${qa(n.title)}"></label>
<div class="cols"><label>Categoría<select id="f-c">${opts}</select></label><label id="f-w" hidden>Nombre de la nueva categoría<input id="f-nc"></label></div>
<label>Nota (opcional, se muestra en un recuadro dentro del caso)<textarea id="f-n" rows="2">${esc(n.note||'')}</textarea></label>
<label class="ck"><input type="checkbox" id="f-new"${n.isNew?' checked':''}> Marcar como “Nuevo”</label>
<div id="f-v">${rows}</div><button class="sm" data-a="add">+ Agregar variante</button>
<div class="dact">${c?'<button class="danger" data-a="del">Eliminar</button>':''}${o&&sig(o)!==sig(c)?'<button data-a="rst">Restaurar original</button>':''}<span class="sp"></span><button data-a="x">Cancelar</button><button class="pri" data-a="ok">Guardar</button></div>`);
}
function saveForm(){
  const t=$('#f-t').value.trim();if(!t)return toast('Falta el título');
  let cat=$('#f-c').value;
  if(cat==='__new'){const nm=$('#f-nc').value.trim();if(!nm)return toast('Escribe el nombre de la categoría');cat='k'+Date.now();D.cats.push({id:cat,name:nm})}
  const es=[],pt=[];
  document.querySelectorAll('#f-v .vr').forEach(r=>{const a=r.querySelector('[data-f=es]').value.trim(),b=r.querySelector('[data-f=pt]').value.trim();if(a)es.push(a);if(b)pt.push(b)});
  if(!es.length&&!pt.length)return toast('Agrega al menos un texto en español o portugués');
  const d={title:t,cat,note:$('#f-n').value.trim(),isNew:$('#f-new').checked,es,pt};
  let c=cur&&D.cases.find(x=>x.id===cur);
  if(c)Object.assign(c,d);else{c={id:'u'+Date.now(),...d};D.cases.push(c)}
  S.open.add(c.id);dlg.close();commit('Guardado');
}
function openCats(){
  show(`<h3>Categorías</h3>${D.cats.map((c,i)=>{const n=D.cases.filter(x=>x.cat===c.id).length;return `<div class="cr"><input data-cn="${i}" value="${qa(c.name)}" aria-label="Nombre"><span class="cn" title="Casos">${n}</span><button class="sm" data-a="up" data-i="${i}"${i?'':' disabled'}>↑</button><button class="sm" data-a="dn" data-i="${i}"${i<D.cats.length-1?'':' disabled'}>↓</button><button class="sm" data-a="dc" data-i="${i}"${n?' disabled title="Mueve o elimina sus casos primero"':''}>Eliminar</button></div>`}).join('')}
<div class="cr"><input id="nc" placeholder="Nueva categoría"><button class="sm" data-a="ac">Agregar</button></div>
<p class="mu">Para mover un caso a otra categoría, ábrelo con “Editar” y cámbiala allí. Una categoría se puede eliminar cuando queda vacía.</p>
<div class="dact"><span class="sp"></span><button class="pri" data-a="x">Listo</button></div>`);
}
function openBackup(){
  show(`<h3>Respaldo</h3><p class="mu">Tus cambios se guardan solo en este navegador. Copia el respaldo y guárdalo en un archivo para conservarlo o llevarlo a otro equipo. Para recuperarlo, pégalo en este cuadro y pulsa “Cargar”.</p><textarea id="bk" rows="10" spellcheck="false">${esc(JSON.stringify(snap()))}</textarea><div class="dact"><button data-a="cpb">Copiar respaldo</button><button data-a="imp">Cargar el texto del cuadro</button><span class="sp"></span><button class="danger" data-a="rall">Restaurar original</button><button class="pri" data-a="x">Cerrar</button></div>`);
}
dlg.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
  if(a==='x')dlg.close();
  else if(a==='ok')saveForm();
  else if(a==='add'){const v=$('#f-v');v.insertAdjacentHTML('beforeend',vrow('','',v.children.length))}
  else if(a==='rm'){t.closest('.vr').remove();document.querySelectorAll('#f-v .vr b').forEach((b,k)=>b.textContent='Variante '+(k+1))}
  else if(a==='del')ask('¿Eliminar este caso?','del2','Eliminar');
  else if(a==='del2'){D.cases=D.cases.filter(x=>x.id!==cur);S.open.delete(cur);dlg.close();commit('Caso eliminado')}
  else if(a==='rst'){const o=ORIG.cases.find(x=>x.id===cur),c=D.cases.find(x=>x.id===cur);if(!D.cats.some(k=>k.id===o.cat))D.cats.push(clone(ORIG.cats.find(k=>k.id===o.cat)));Object.assign(c,clone(o));dlg.close();commit('Original restaurado')}
  else if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;[D.cats[i],D.cats[j]]=[D.cats[j],D.cats[i]];commit();openCats()}
  else if(a==='dc'){D.cats.splice(i,1);commit();openCats()}
  else if(a==='ac'){const n=$('#nc').value.trim();if(n){D.cats.push({id:'k'+Date.now(),name:n});commit();openCats()}}
  else if(a==='cpb')copy($('#bk').value).then(()=>toast('Respaldo copiado'));
  else if(a==='imp'){try{const o=JSON.parse($('#bk').value);if(!valid(o))throw 0;pending=o;ask('¿Reemplazar todo con este respaldo?','imp2','Cargar')}catch(_){toast('El texto no es un respaldo válido')}}
  else if(a==='imp2'){D=pending;S.open.clear();dlg.close();commit('Respaldo cargado')}
  else if(a==='rall')ask('¿Volver todo al contenido original? Se pierden tus cambios.','rall2','Restaurar todo');
  else if(a==='rall2'){D=clone(ORIG);S.open.clear();S.cat='all';dlg.close();commit('Contenido original restaurado')}
});
dlg.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-c')$('#f-w').hidden=t.value!=='__new';
  else if(t.dataset.cn!==undefined){const i=+t.dataset.cn,v=t.value.trim();if(v){D.cats[i].name=v;commit()}else t.value=D.cats[i].name}
});
render();
</script>
</body>
</html>
